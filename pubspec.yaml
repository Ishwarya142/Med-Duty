name: medduty
description: "MedDuty - Doctor, Nurse & Hospital Duty Management App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Supabase
  supabase_flutter: ^2.8.0

  # UI
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  lottie: ^3.3.2
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.2.0
  image_cropper: ^8.0.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  emoji_picker_flutter: ^3.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: 11.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  gal: ^2.3.1
  package_info_plus: ^8.3.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/json/