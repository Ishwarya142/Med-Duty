name: medduty
description: "MedDuty - Doctor, Nurse & Hospital Duty Management App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # UI
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  lottie: ^3.3.2
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/json/